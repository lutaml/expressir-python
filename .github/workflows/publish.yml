name: Publish to PyPI

# The publish path is trusted-publishing (PyPI trusted publisher on
# the lutaml/expressir-python repository); registering that publisher
# is an OWNER step and is done once on PyPI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The exact version to publish (must match pyproject.toml)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the cdylib
        run: cargo build --release
        working-directory: expressir-rs
      - name: Vendor the cdylib into the package
        run: |
          mkdir -p src/expressir/lib
          cp expressir-rs/target/release/libexpressir_rs${{ matrix.os == 'macos-14' && '.dylib' || '.so' }} src/expressir/lib/
      - name: Stamp the requested version
        run: |
          python3 - <<'PY'
          import pathlib, re
          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text()
          version = "${{ github.event.inputs.version }}"
          text, count = re.subn(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)
          assert count == 1, "version line not found"
          pyproject.write_text(text)
          PY
      - name: Build the wheel
        run: python3 -m pip install build && python3 -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
